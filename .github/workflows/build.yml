name: Build CI

on:
  push:
  pull_request:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ARM64 Toolchain
        run: |
          curl -fL -o arm-gnu-toolchain.tar.xz \
            https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -Jxf arm-gnu-toolchain.tar.xz

      - name: Build KPM and check stack frames
        run: |
          export PATH="$(pwd)/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin:$PATH"
          make clean
          make EXTRA_CFLAGS="-Wframe-larger-than=1792"
          if [ ! -f hmkpm.kpm ]; then
            echo "ERROR: hmkpm.kpm not found after build"
            exit 1
          fi

      - name: Audit undefined symbols
        run: |
          export PATH="$(pwd)/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin:$PATH"
          UNDEF=$(aarch64-none-elf-nm -u hmkpm.kpm)
          echo "$UNDEF"
          if echo "$UNDEF" | grep -E '\b(__aarch64_|__stack_chk_fail|memset|memcpy|memmove|memcmp)\b'; then
            echo "ERROR: Disallowed undefined runtime symbol detected in hmkpm.kpm"
            exit 1
          fi

      - name: Verify standalone UAPI header (C11 & C++17)
        run: |
          export PATH="$(pwd)/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin:$PATH"
          printf '#include "hmkpm_uapi.h"\nint hmkpm_uapi_check(void) { return (int)HMKPM_VERSION_CODE; }\n' > /tmp/uapi_check.c
          aarch64-none-elf-gcc -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/uapi_check.c -o /tmp/uapi_check_c.o
          aarch64-none-elf-g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -x c++ -c /tmp/uapi_check.c -o /tmp/uapi_check_cpp.o
          rm -f /tmp/uapi_check.c /tmp/uapi_check_c.o /tmp/uapi_check_cpp.o
